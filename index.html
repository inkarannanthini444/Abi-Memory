<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abi Memory - Card Matching Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: space-between;
        }

        header {
            margin-top: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4), 2px 2px 0px #000;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        /* Stats Bar */
        .stats-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 450px;
            margin: 15px 0;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .stat-box {
            font-size: 1.1rem;
            font-weight: bold;
            color: #e2e8f0;
        }

        .stat-box span {
            color: #38bdf8;
        }

        /* Game Board */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 450px;
            padding: 10px;
            perspective: 1000px;
        }

        /* Card Container */
        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }

        /* Card Faces */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            border: 2px solid #334155;
        }

        .card-front {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #38bdf8;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .card-front::after {
            content: "❓";
            font-size: 1.8rem;
            opacity: 0.8;
        }

        .card-back {
            background: #1e293b;
            border-color: #38bdf8;
            transform: rotateY(180deg);
        }

        .card.matched .card-back {
            background: #065f46;
            border-color: #10b981;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.08); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        /* Controls */
        .controls {
            margin: 15px 0 25px 0;
        }

        .btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #7dd3fc, #38bdf8);
        }

        /* Win Overlay Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #1e293b;
            border: 2px solid #38bdf8;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .modal h2 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .modal p {
            color: #cbd5e1;
            font-size: 1.05rem;
            margin: 8px 0;
        }

        .modal .btn {
            margin-top: 20px;
        }

        /* Footer */
        footer {
            width: 100%;
            background: #020617;
            border-top: 1px solid #1e293b;
            text-align: center;
            padding: 15px 0;
            font-size: 0.95rem;
            color: #94a3b8;
        }

        footer strong {
            color: #38bdf8;
        }

        /* Responsive adjustment for small devices */
        @media (max-width: 400px) {
            .game-board {
                gap: 8px;
            }
            .card-face {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ABI MEMORY</h1>
        <div class="subtitle">Match the pairs as fast as you can!</div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-container">
        <div class="stat-box">Moves: <span id="movesCount">0</span></div>
        <div class="stat-box">Time: <span id="timerText">0s</span></div>
    </div>

    <!-- Game Board -->
    <div class="game-board" id="gameBoard"></div>

    <!-- Restart Button -->
    <div class="controls">
        <button class="btn" onclick="initGame()">Restart Game</button>
    </div>

    <!-- Victory Modal -->
    <div class="modal-overlay" id="winModal">
        <div class="modal">
            <h2>🎉 Congratulations!</h2>
            <p>You solved the memory puzzle!</p>
            <p>Moves: <strong id="finalMoves" style="color: #38bdf8;">0</strong></p>
            <p>Time Taken: <strong id="finalTime" style="color: #38bdf8;">0s</strong></p>
            <button class="btn" onclick="closeModal(); initGame();">Play Again</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        Developed By <strong>Inkaran Abisan</strong> | &copy; 2026 Abi Memory
    </footer>

    <script>
        const emojis = ['🚀', '🎮', '🍕', '🐱', '⚽', '🎨', '💎', '🔥'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let isGameStarted = false;
        let canFlip = true;

        const board = document.getElementById('gameBoard');
        const movesCountEl = document.getElementById('movesCount');
        const timerTextEl = document.getElementById('timerText');
        const winModal = document.getElementById('winModal');
        const finalMovesEl = document.getElementById('finalMoves');
        const finalTimeEl = document.getElementById('finalTime');

        // Initialize / Reset Game
        function initGame() {
            // Reset variables
            board.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            timer = 0;
            isGameStarted = false;
            canFlip = true;

            movesCountEl.innerText = '0';
            timerTextEl.innerText = '0s';

            if (timerInterval) clearInterval(timerInterval);

            // Duplicate array for pairs and shuffle
            const deck = [...emojis, ...emojis];
            shuffle(deck);

            // Create cards DOM
            deck.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.symbol = emoji;

                card.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back">${emoji}</div>
                `;

                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
        }

        // Fisher-Yates Shuffle Algorithm
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Start Timer
        function startTimer() {
            isGameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                timerTextEl.innerText = `${timer}s`;
            }, 1000);
        }

        // Flip Card Action
        function flipCard(card) {
            // Prevent flipping if animation running, already flipped, or already matched
            if (!canFlip || card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }

            // Start timer on first flip
            if (!isGameStarted) {
                startTimer();
            }

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesCountEl.innerText = moves;
                checkMatch();
            }
        }

        // Match Checking Logic
        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.symbol === card2.dataset.symbol;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                flippedCards = [];
                matchedPairs++;

                if (matchedPairs === emojis.length) {
                    clearInterval(timerInterval);
                    setTimeout(showWinModal, 500);
                }
            } else {
                canFlip = false;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                }, 900);
            }
        }

        // Victory Display
        function showWinModal() {
            finalMovesEl.innerText = moves;
            finalTimeEl.innerText = `${timer}s`;
            winModal.classList.add('active');
        }

        function closeModal() {
            winModal.classList.remove('active');
        }

        // Start game on load
        window.onload = initGame;
    </script>
</body>
</html>
